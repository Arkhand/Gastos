<!-- @dsCard group="Mascota Chubi" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{margin:0;padding:30px 20px;background:radial-gradient(circle at 20% 10%,#f5ede2,#e7ded2 70%);color:#42352c}
  .stage{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:14px;width:180px;padding-top:18px}
  .cap{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:#9a8a7c}
  .cap b{color:#e0683c}
  .chubi{width:148px;height:148px}
</style>
</head>
<body>
  <div class="stage">

    <div class="cell">
      <div class="chubi chubi-idle">
        <div class="chubi-ring chubi-ring-1"></div><div class="chubi-ring chubi-ring-2"></div><div class="chubi-ring chubi-ring-3"></div>
        <div class="chubi-think"><span></span><span></span><span></span></div>
        <div class="chubi-spark chubi-spark-1">✦</div><div class="chubi-spark chubi-spark-2">✦</div><div class="chubi-spark chubi-spark-3">✦</div><div class="chubi-spark chubi-spark-4">✧</div>
        <div class="chubi-bob">
          <div class="chubi-feet"><div class="chubi-foot"></div><div class="chubi-foot"></div></div>
          <div class="chubi-body">
            <div class="chubi-arm chubi-arm-l"></div><div class="chubi-arm chubi-arm-r"></div>
            <div class="chubi-cheek chubi-cheek-l"></div><div class="chubi-cheek chubi-cheek-r"></div>
            <div class="chubi-face">
              <div class="chubi-eyes">
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye-happy"></div><div class="chubi-eye-happy"></div>
              </div>
              <div class="chubi-mouth-wrap"><div class="chubi-mouth-smile"></div><div class="chubi-mouth-o"></div><div class="chubi-mouth-flat"></div><div class="chubi-mouth-big"><div class="chubi-tongue"></div></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap"><b>idle</b> · en reposo</div>
    </div>

    <div class="cell">
      <div class="chubi chubi-listening">
        <div class="chubi-ring chubi-ring-1"></div><div class="chubi-ring chubi-ring-2"></div><div class="chubi-ring chubi-ring-3"></div>
        <div class="chubi-think"><span></span><span></span><span></span></div>
        <div class="chubi-spark chubi-spark-1">✦</div><div class="chubi-spark chubi-spark-2">✦</div><div class="chubi-spark chubi-spark-3">✦</div><div class="chubi-spark chubi-spark-4">✧</div>
        <div class="chubi-bob">
          <div class="chubi-feet"><div class="chubi-foot"></div><div class="chubi-foot"></div></div>
          <div class="chubi-body">
            <div class="chubi-arm chubi-arm-l"></div><div class="chubi-arm chubi-arm-r"></div>
            <div class="chubi-cheek chubi-cheek-l"></div><div class="chubi-cheek chubi-cheek-r"></div>
            <div class="chubi-face">
              <div class="chubi-eyes">
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye-happy"></div><div class="chubi-eye-happy"></div>
              </div>
              <div class="chubi-mouth-wrap"><div class="chubi-mouth-smile"></div><div class="chubi-mouth-o"></div><div class="chubi-mouth-flat"></div><div class="chubi-mouth-big"><div class="chubi-tongue"></div></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap"><b>listening</b> · escuchando</div>
    </div>

    <div class="cell">
      <div class="chubi chubi-thinking">
        <div class="chubi-ring chubi-ring-1"></div><div class="chubi-ring chubi-ring-2"></div><div class="chubi-ring chubi-ring-3"></div>
        <div class="chubi-think"><span></span><span></span><span></span></div>
        <div class="chubi-spark chubi-spark-1">✦</div><div class="chubi-spark chubi-spark-2">✦</div><div class="chubi-spark chubi-spark-3">✦</div><div class="chubi-spark chubi-spark-4">✧</div>
        <div class="chubi-bob">
          <div class="chubi-feet"><div class="chubi-foot"></div><div class="chubi-foot"></div></div>
          <div class="chubi-body">
            <div class="chubi-arm chubi-arm-l"></div><div class="chubi-arm chubi-arm-r"></div>
            <div class="chubi-cheek chubi-cheek-l"></div><div class="chubi-cheek chubi-cheek-r"></div>
            <div class="chubi-face">
              <div class="chubi-eyes">
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye-happy"></div><div class="chubi-eye-happy"></div>
              </div>
              <div class="chubi-mouth-wrap"><div class="chubi-mouth-smile"></div><div class="chubi-mouth-o"></div><div class="chubi-mouth-flat"></div><div class="chubi-mouth-big"><div class="chubi-tongue"></div></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap"><b>thinking</b> · procesando</div>
    </div>

    <div class="cell">
      <div class="chubi chubi-happy">
        <div class="chubi-ring chubi-ring-1"></div><div class="chubi-ring chubi-ring-2"></div><div class="chubi-ring chubi-ring-3"></div>
        <div class="chubi-think"><span></span><span></span><span></span></div>
        <div class="chubi-spark chubi-spark-1">✦</div><div class="chubi-spark chubi-spark-2">✦</div><div class="chubi-spark chubi-spark-3">✦</div><div class="chubi-spark chubi-spark-4">✧</div>
        <div class="chubi-bob">
          <div class="chubi-feet"><div class="chubi-foot"></div><div class="chubi-foot"></div></div>
          <div class="chubi-body">
            <div class="chubi-arm chubi-arm-l"></div><div class="chubi-arm chubi-arm-r"></div>
            <div class="chubi-cheek chubi-cheek-l"></div><div class="chubi-cheek chubi-cheek-r"></div>
            <div class="chubi-face">
              <div class="chubi-eyes">
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye"><div class="chubi-pupil"><div class="chubi-shine"></div></div></div>
                <div class="chubi-eye-happy"></div><div class="chubi-eye-happy"></div>
              </div>
              <div class="chubi-mouth-wrap"><div class="chubi-mouth-smile"></div><div class="chubi-mouth-o"></div><div class="chubi-mouth-flat"></div><div class="chubi-mouth-big"><div class="chubi-tongue"></div></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap"><b>happy</b> · gasto guardado</div>
    </div>

  </div>
</body>
</html>
