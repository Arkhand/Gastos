<!-- @dsCard group="Pantallas" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{margin:0;padding:0;background:radial-gradient(circle at 20% 10%,#f5ede2,#e7ded2 70%)}
  .app-root{min-height:auto;padding-top:18px;padding-bottom:8px;box-shadow:0 6px 24px rgba(120,90,60,.14)}
  .tabbar{position:static}
</style>
</head>
<body>
  <div class="app-root nosotros">
    <div class="nos-hero">
      <div class="nos-kicker">NOSOTROS</div>
      <div class="nos-title">Un equipo<br />familiar 💛</div>
      <div class="nos-text">Gastos nació en la mesa de casa, anotando en qué se nos iba la plata. Lo hacemos los tres.</div>
    </div>

    <div class="team-stage">
      <div class="team-card">
        <div class="team-photo" style="--ring: var(--lilac-deep)"><img src="mama.jpg" alt="Mamá" /></div>
        <div class="team-name">Mamá</div>
        <div class="team-role">Las cuentas</div>
      </div>
      <div class="team-card">
        <div class="team-photo" style="--ring: var(--mint-deep)"><img src="papa.jpg" alt="Papá" /></div>
        <div class="team-name">Papá</div>
        <div class="team-role">El que gasta</div>
      </div>
      <div class="team-card">
        <div class="team-photo" style="--ring: var(--butter-deep)"><img src="nena.jpg" alt="Peque" /></div>
        <div class="team-name">Peque</div>
        <div class="team-role">Antojos 🍭</div>
      </div>
    </div>

    <div class="nos-quote">"Si lo decís en voz alta, ya está cargado."</div>

    <nav class="tabbar">
      <a class="tab" href="#">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
        <span>Cargar</span>
      </a>
      <a class="tab" href="#">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="4" y="12" width="4" height="7" rx="1.2" fill="currentColor"></rect><rect x="10" y="7" width="4" height="12" rx="1.2" fill="currentColor"></rect><rect x="16" y="9" width="4" height="10" rx="1.2" fill="currentColor"></rect></svg>
        <span>Resumen</span>
      </a>
      <a class="tab tab-on" href="#">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-7-9.3A3.7 3.7 0 0 1 12 8a3.7 3.7 0 0 1 7 2.7C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
        <span>Nosotros</span>
      </a>
    </nav>
  </div>
</body>
</html>
