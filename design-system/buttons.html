<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{margin:0;padding:28px;background:radial-gradient(circle at 20% 10%,#f5ede2,#e7ded2 70%);color:#42352c}
  h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:#9a8a7c;text-transform:uppercase;letter-spacing:.6px;margin:0 0 12px}
  h2:not(:first-child){margin-top:28px}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cap{font-family:'Nunito',sans-serif;font-size:11px;color:#9a8a7c}
  .fab{position:static}
  .w{max-width:380px}
</style>
</head>
<body>
  <h2>Acción principal</h2>
  <div class="row">
    <div class="col">
      <button class="mic-btn" type="button" aria-label="Hablar un gasto">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="2.5" width="6" height="11.5" rx="3" fill="currentColor"></rect>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"></path>
          <path d="M12 17.5V21" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"></path>
          <path d="M8.5 21h7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"></path>
        </svg>
      </button>
      <span class="cap">.mic-btn · micrófono</span>
    </div>
    <div class="col">
      <button class="fab" type="button" aria-label="Cargar gasto"><span>＋</span></button>
      <span class="cap">.fab</span>
    </div>
  </div>

  <h2>Acciones de la hoja</h2>
  <div class="w">
    <div class="sheet-actions">
      <button type="button" class="btn-ghost">Cancelar</button>
      <button type="submit" class="btn-save">Guardar gasto</button>
    </div>
    <button type="submit" class="btn-delete">🗑 Borrar gasto</button>
  </div>

  <h2>Login</h2>
  <div class="row">
    <a class="google-btn" href="#">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"></path>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"></path>
        <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.6 39.6 16.2 44 24 44z"></path>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.3 5.3C41.4 36.8 44 31 44 24c0-1.3-.1-2.3-.4-3.5z"></path>
      </svg>
      Entrar con Google
    </a>
  </div>
</body>
</html>
