<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{margin:0;padding:24px;background:radial-gradient(circle at 20% 10%,#f5ede2,#e7ded2 70%)}
  .frame{max-width:460px;margin:0 auto;background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:0 6px 16px rgba(120,90,60,.12)}
  .tabbar{position:static}
</style>
</head>
<body>
  <div class="frame">
    <nav class="tabbar">
      <a class="tab tab-on" href="#">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
        <span>Cargar</span>
      </a>
      <a class="tab" href="#">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="4" y="12" width="4" height="7" rx="1.2" fill="currentColor"></rect><rect x="10" y="7" width="4" height="12" rx="1.2" fill="currentColor"></rect><rect x="16" y="9" width="4" height="10" rx="1.2" fill="currentColor"></rect></svg>
        <span>Resumen</span>
      </a>
      <a class="tab" href="#">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-7-9.3A3.7 3.7 0 0 1 12 8a3.7 3.7 0 0 1 7 2.7C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
        <span>Nosotros</span>
      </a>
    </nav>
  </div>
</body>
</html>
